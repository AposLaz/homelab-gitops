apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: grafana-dashboard-node-exporter
    files:
      - node-exporter.json
    options:
      annotations:
        grafana_folder: Kubernetes

  - name: grafana-dashboard-longhorn
    files:
      - longhorn.json
    options:
      annotations:
        grafana_folder: Storage

  - name: grafana-dashboard-argocd
    files:
      - argo.json
    options:
      annotations:
        grafana_folder: GitOps

  - name: grafana-dashboard-metallb
    files:
      - metallb.json
    options:
      annotations:
        grafana_folder: Networking
