apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.11.0
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/values/monitoring/kube_prometheus_stack/common.yaml
          - $values/values/monitoring/kube_prometheus_stack/pve01.yaml

    - repoURL: https://github.com/AposLaz/homelab-gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/AposLaz/homelab-gitops.git
      targetRevision: main
      path: values/monitoring/secrets

    - repoURL: https://github.com/AposLaz/homelab-gitops.git
      targetRevision: main
      path: values/monitoring/dashboards

    - repoURL: https://github.com/AposLaz/homelab-gitops.git
      targetRevision: main
      path: values/monitoring/rules

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
